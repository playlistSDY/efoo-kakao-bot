services:
  chatbot:
    build: .
    container_name: efoo-chatbot
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/efoo_chatbot.db
      APP_TIMEZONE: Asia/Seoul
    ports:
      - "8000:8000"
    volumes:
      - efoo-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  efoo-data:
